# CRYPTO-GATEWAY - DOCKER COMPOSE (SCAFFOLDING EDUCACIONAL)
# ==============================================================================
# TODO: [CONCEITO]
# Estude como o Docker Compose gerencia redes (networks), volumes persistentes
# e healthchecks entre containers para garantir que serviços dependentes
# subam de forma isolada e segura.
#
# TODO: [PASSO A PASSO]
# 1. Defina os 4 serviços da nossa infraestrutura local:
#    - redis: Armazenamento em memória para o Rate Limiting distribuído.
#    - postgres: Banco relacional (para futuras chaves de API / clientes).
#    - prometheus: Coletor de métricas (time-series) que fará scrape do gateway.
#    - grafana: Dashboard visual conectado ao Prometheus como Data Source.
# 2. Configure mapeamento de portas (ports) para acessar da sua máquina host.
# 3. Configure volumes nomeados para não perder dados ao reiniciar os containers.
# 4. Configure uma rede (network) compartilhada para comunicação interna.
#
# TODO: [DICA DE CONFIGURAÇÃO]
# - Para que o Prometheus (dentro do container) consiga acessar o seu Gateway
#   rodando fora do Docker (via `go run`), pesquise sobre `extra_hosts` com
#   `host.docker.internal:host-gateway` no Linux!
#
# TODO: [ARMADILHA COMUM]
# - Usar a tag `:latest` em imagens Docker (prefira versões fixas como `redis:7-alpine`,
#   `postgres:16-alpine`, `prom/prometheus:v2.51.0`, `grafana/grafana:10.4.0`).
# - Esquecer de definir variáveis obrigatórias do Postgres (`POSTGRES_USER`,
#   `POSTGRES_PASSWORD`, `POSTGRES_DB`), fazendo o container crashar no boot.

services:
  # ----------------------------------------------------------------------------
  # 1. REDIS (Rate Limiting & Cache)
  # ----------------------------------------------------------------------------
  # redis:
  #   image: ...
  #   container_name: ...
  #   ports:
  #     - "6379:6379"
  #   command: ... (Dica: habilite appendonly ou defina senha se desejar)
  #   healthcheck: ... (Dica: redis-cli ping)

  # ----------------------------------------------------------------------------
  # 2. POSTGRESQL (Gerenciamento de Clientes / Chaves Criptográficas)
  # ----------------------------------------------------------------------------
  # postgres:
  #   image: ...
  #   container_name: ...
  #   environment:
  #     POSTGRES_USER: ...
  #     POSTGRES_PASSWORD: ...
  #     POSTGRES_DB: ...
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - ...

  # ----------------------------------------------------------------------------
  # 3. PROMETHEUS (Coleta de Métricas / Observabilidade)
  # ----------------------------------------------------------------------------
  # prometheus:
  #   image: ...
  #   container_name: ...
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  # ----------------------------------------------------------------------------
  # 4. GRAFANA (Visualização e Dashboards)
  # ----------------------------------------------------------------------------
  # grafana:
  #   image: ...
  #   container_name: ...
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   depends_on:
  #     - prometheus

