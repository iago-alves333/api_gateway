services:
  # ----------------------------------------------------------------------------
  # 1. REDIS (Rate Limiting Distribuído)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: crypto-gateway-redis
    ports:
      - "6380:6380"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway_net

  # ----------------------------------------------------------------------------
  # 2. POSTGRESQL (Gerenciamento de Clientes / Chaves Criptográficas)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: crypto-gateway-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway_dev}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_gateway}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-crypto_gateway}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway_net

  # ----------------------------------------------------------------------------
  # 3. PROMETHEUS ( Coleta de Métricas / Observabilidade)
  # ----------------------------------------------------------------------------
